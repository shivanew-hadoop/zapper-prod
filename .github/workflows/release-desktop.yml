name: Release Zapper desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Build portable Windows app
        working-directory: apps/desktop
        run: npm run dist
      - name: Create GitHub Release and upload Zapper
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/desktop/dist/**/Zapper-Windows-x64.exe
