name: Source checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: API syntax
        run: |
          node --check apps/api/server.js
          node --check apps/api/session-control.js
          node apps/api/tests/smoke.js
          node apps/api/tests/trial-persistence.js
      - name: Desktop syntax
        run: |
          node --check apps/desktop/main.js
          node --check apps/desktop/audio-ws/server.js
          node apps/desktop/tests/overlay-readiness.js
          node --check apps/desktop/preload.js
          node --check apps/desktop/overlay/overlay.js
          node --check apps/desktop/meet-controller/index.js
          node --check apps/desktop/transcriber/remoteDeepgram.js
      - name: Web syntax and session guards
        run: |
          node --check apps/web/src/main.js
          node apps/web/tests/desktop-readiness.mjs
          node apps/web/tests/create-session-availability.mjs
          node apps/web/tests/device-session-ownership.mjs
          node apps/web/tests/host-session-selection.mjs
